<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spacing scale</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 700px;
        padding: 24px 28px;
        background: var(--bg-page);
        box-sizing: border-box;
        font-family: var(--font-sans);
      }
      .row {
        display: grid;
        grid-template-columns: 70px 1fr 60px;
        align-items: center;
        gap: 14px;
        padding: 6px 0;
      }
      .name {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg-1);
      }
      .val {
        font-size: 11px;
        color: var(--fg-3);
        text-align: right;
        font-feature-settings: "tnum";
      }
      .bar {
        height: 14px;
        background: var(--accent);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="name">--s-1</div>
      <div><div class="bar" style="width: 4px"></div></div>
      <div class="val">4px</div>
    </div>
    <div class="row">
      <div class="name">--s-2</div>
      <div><div class="bar" style="width: 8px"></div></div>
      <div class="val">8px</div>
    </div>
    <div class="row">
      <div class="name">--s-3</div>
      <div><div class="bar" style="width: 12px"></div></div>
      <div class="val">12px</div>
    </div>
    <div class="row">
      <div class="name">--s-4</div>
      <div><div class="bar" style="width: 16px"></div></div>
      <div class="val">16px</div>
    </div>
    <div class="row">
      <div class="name">--s-5</div>
      <div><div class="bar" style="width: 20px"></div></div>
      <div class="val">20px</div>
    </div>
    <div class="row">
      <div class="name">--s-6</div>
      <div><div class="bar" style="width: 24px"></div></div>
      <div class="val">24px</div>
    </div>
    <div class="row">
      <div class="name">--s-8</div>
      <div><div class="bar" style="width: 32px"></div></div>
      <div class="val">32px</div>
    </div>
    <div class="row">
      <div class="name">--s-10</div>
      <div><div class="bar" style="width: 40px"></div></div>
      <div class="val">40px</div>
    </div>
    <div class="row">
      <div class="name">--s-12</div>
      <div><div class="bar" style="width: 48px"></div></div>
      <div class="val">48px</div>
    </div>
    <div class="row">
      <div class="name">--s-16</div>
      <div><div class="bar" style="width: 64px"></div></div>
      <div class="val">64px</div>
    </div>
    <div class="row">
      <div class="name">--s-20</div>
      <div><div class="bar" style="width: 80px"></div></div>
      <div class="val">80px</div>
    </div>
  </body>
</html>
