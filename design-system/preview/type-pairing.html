<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Type pairing — display + body in context</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 700px;
        padding: 28px 32px;
        background: var(--bg-page);
        box-sizing: border-box;
      }
      .eyebrow {
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 12px;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 52px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
        color: var(--fg-1);
      }
      h1 .me {
        color: var(--accent);
      }
      p {
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.6;
        color: var(--fg-2);
        margin: 0;
        max-width: 540px;
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Just dropped</p>
    <h1>The case is closed<span class="me">.</span></h1>
    <p>
      Funko Pops, slabbed trading cards, and the figures collectors have been
      hunting. Hand‑checked, packed by hand, shipped the next day.
    </p>
  </body>
</html>
