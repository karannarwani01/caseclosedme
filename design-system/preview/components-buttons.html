<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Buttons — anime colors</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      --anime-pink:   #ff2e93;
      --anime-purple: #8a2be8;
      --anime-cyan:   #1ee3ff;
      --anime-lime:   #c4ff3d;
      --anime-orange: #ff6a1f;
      --anime-ink:    #0d0a1a;

      width: 700px;
      padding: 24px;
      background: var(--bg-page);
      box-sizing: border-box;
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
      align-items: start;
    }
    .label {
      grid-column: 1 / -1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--anime-ink);
      margin: 6px 0 -2px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 22px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 2.5px solid var(--anime-ink);
      border-radius: 14px;
      color: var(--anime-ink);
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 4px 4px 0 0 var(--anime-ink);
      transition: transform 100ms var(--ease-out), box-shadow 100ms var(--ease-out);
      position: relative;
    }
    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 0 var(--anime-ink);
    }
    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 0 var(--anime-ink);
    }
    .btn-pink   { background: var(--anime-pink);   color: white; }
    .btn-purple { background: var(--anime-purple); color: white; }
    .btn-cyan   { background: var(--anime-cyan);   color: var(--anime-ink); }
    .btn-lime   { background: var(--anime-lime);   color: var(--anime-ink); }
    .btn-orange { background: var(--anime-orange); color: white; }
    .btn-ink    { background: var(--anime-ink);    color: white; }
    .btn[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 4px 4px 0 0 var(--anime-ink) !important;
    }
    .btn-icon {
      width: 56px;
      flex: none;
      padding: 12px 0;
    }
    .btn-icon svg { width: 22px; height: 22px; stroke-width: 2.5; }
    svg { width: 18px; height: 18px; stroke-width: 2; }
    .plus { width: 16px; height: 16px; }
    .row {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="label">Primary · transaction</div>
  <button class="btn btn-pink">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="plus"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
    Add to cart
  </button>
  <button class="btn btn-ink">Checkout →</button>

  <div class="label">Secondary · navigation</div>
  <button class="btn btn-cyan">Shop now</button>
  <button class="btn btn-lime">Just dropped</button>

  <div class="label">Tertiary · marketing</div>
  <button class="btn btn-purple">Subscribe</button>
  <button class="btn btn-orange">−15% sale</button>

  <div class="label">States · disabled · icon</div>
  <button class="btn btn-pink" disabled>Sold out</button>
  <div class="row">
    <button class="btn btn-cyan btn-icon" aria-label="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
    </button>
    <button class="btn btn-lime btn-icon" aria-label="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
    </button>
    <button class="btn btn-purple btn-icon" aria-label="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
    </button>
  </div>
</body>
</html>
