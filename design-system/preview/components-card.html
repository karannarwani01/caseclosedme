<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Product card — anime style</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        --anime-pink: #ff2e93;
        --anime-purple: #8a2be8;
        --anime-cyan: #1ee3ff;
        --anime-lime: #c4ff3d;
        --anime-yellow: #ffd60a;
        --anime-ink: #0d0a1a;
        --anime-paper: #fff8f0;

        width: 700px;
        padding: 32px 28px 28px;
        background:
          radial-gradient(circle, rgba(13, 10, 26, 0.07) 1.5px, transparent 2px)
            0 0/14px 14px,
          var(--anime-paper);
        box-sizing: border-box;
        font-family: var(--font-sans);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }

      .card {
        position: relative;
        aspect-ratio: 1;
        border-radius: 16px;
        background: white;
        border: 2.5px solid var(--anime-ink);
        box-shadow: 5px 5px 0 0 var(--anime-ink);
        overflow: hidden;
        transition:
          transform 120ms var(--ease-out),
          box-shadow 120ms var(--ease-out);
      }
      .card.hover {
        transform: translate(-3px, -3px) rotate(-1.5deg);
        box-shadow: 9px 9px 0 0 var(--anime-pink);
      }

      /* Action-line speed burst behind the figure (anime trope) */
      .burst {
        position: absolute;
        inset: 8% 8% auto auto;
        width: 80%;
        height: 80%;
        inset: 10%;
        background: repeating-conic-gradient(
          from 0deg at 50% 45%,
          var(--anime-yellow) 0deg 8deg,
          transparent 8deg 16deg
        );
        mask-image: radial-gradient(
          circle at 50% 45%,
          black 0 36%,
          transparent 70%
        );
        -webkit-mask-image: radial-gradient(
          circle at 50% 45%,
          black 0 36%,
          transparent 70%
        );
        opacity: 0.55;
        transition: transform var(--dur-slow) var(--ease-out);
      }
      .card.hover .burst {
        transform: rotate(40deg);
      }

      .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 24px 60px;
        box-sizing: border-box;
      }
      .placeholder .figure {
        width: 70%;
        aspect-ratio: 1;
        background:
          radial-gradient(
            circle at 50% 35%,
            var(--anime-yellow) 0 28%,
            transparent 28%
          ),
          radial-gradient(
            circle at 50% 60%,
            var(--anime-cyan) 0 32%,
            transparent 32%
          );
        border-radius: 50%;
        border: 2.5px solid var(--anime-ink);
        transition: transform var(--dur-slow) var(--ease-out);
        filter: drop-shadow(4px 4px 0 var(--anime-ink));
        position: relative;
        z-index: 1;
      }
      .card.hover .figure {
        transform: scale(1.08) rotate(6deg);
      }

      /* Sticker badge — rotated, chunky border */
      .badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 5px 12px;
        background: var(--anime-yellow);
        color: var(--anime-ink);
        border: 2.5px solid var(--anime-ink);
        border-radius: 999px;
        box-shadow: 3px 3px 0 0 var(--anime-ink);
        font-family: var(--font-display);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transform: rotate(-6deg);
        z-index: 3;
      }

      /* Caption pill (Rest / Hover state label) */
      .caption {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 4px 10px;
        font-family: var(--font-display);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: white;
        color: var(--anime-ink);
        border: 2px solid var(--anime-ink);
        border-radius: 6px;
        z-index: 3;
      }
      .card.hover .caption {
        background: var(--anime-pink);
        color: white;
        border-color: var(--anime-ink);
      }

      /* Label bar at the bottom */
      .label {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px 7px 12px;
        background: white;
        border: 2.5px solid var(--anime-ink);
        border-radius: 12px;
        box-shadow: 3px 3px 0 0 var(--anime-ink);
        z-index: 3;
      }
      .label .title {
        flex: 1;
        margin: 0;
        font-family: var(--font-display);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.005em;
        color: var(--anime-ink);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .label .price {
        flex: none;
        padding: 5px 12px;
        background: var(--anime-lime);
        color: var(--anime-ink);
        border: 2px solid var(--anime-ink);
        border-radius: 999px;
        font-family: var(--font-display);
        font-size: 12px;
        font-weight: 800;
        font-feature-settings: "tnum";
        box-shadow: 2px 2px 0 0 var(--anime-ink);
        transform: rotate(-3deg);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="burst"></div>
      <span class="badge">PSA 9</span>
      <span class="caption">Rest</span>
      <div class="placeholder"><div class="figure"></div></div>
      <div class="label">
        <div class="title">Pikachu — Holographic</div>
        <div class="price">$199</div>
      </div>
    </div>
    <div class="card hover">
      <div class="burst"></div>
      <span class="badge">PSA 9</span>
      <span class="caption">Hover</span>
      <div class="placeholder"><div class="figure"></div></div>
      <div class="label">
        <div class="title">Pikachu — Holographic</div>
        <div class="price">$199</div>
      </div>
    </div>
  </body>
</html>
